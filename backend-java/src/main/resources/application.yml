# ATS Backend - Spring Boot 3 / Java 21 Configuration
spring:
  application:
    name: ats-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ats_db}
    username: ${DATABASE_USER:ats_user}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: "SET search_path TO public"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    # If V3 was modified after being applied, repair the stored checksum automatically
    repair-on-migrate: false

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Security / JWT
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  tenant:
    header: X-Tenant-Id
  # First-run bootstrap: set both vars to create the initial super_admin.
  # Remove / unset them after first startup.
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  mail:
    imap:
      enabled: ${IMAP_INGESTION_ENABLED:false}
      host: ${IMAP_HOST:imap.gmail.com}
      port: ${IMAP_PORT:993}
      username: ${IMAP_USERNAME:}
      password: ${IMAP_PASSWORD:}
      ssl: ${IMAP_SSL:true}
      folder: ${IMAP_FOLDER:INBOX}
      poll-cron: ${IMAP_POLL_CRON:0 */5 * * * *}

# JobRunr — background job processing
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 4
    job-scheduler:
      enabled: true
    dashboard:
      # Disabled by default. Enable locally by setting JOBRUNR_DASHBOARD_ENABLED=true.
      # Never expose port 8000 to the internet.
      enabled: ${JOBRUNR_DASHBOARD_ENABLED:false}
      port: 8000

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

# Server
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    com.ats: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
