version: '3.8'

services:
  # PostgreSQL Database with Row-Level Security (RLS)
  postgres:
    image: postgres:15-alpine
    container_name: ats-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats_db}
      POSTGRES_USER: ${POSTGRES_USER:-ats_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ats_user} -d ${POSTGRES_DB:-ats_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for pub/sub and high-speed caching
  redis:
    image: redis:7-alpine
    container_name: ats-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ats-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Java 21 / Spring Boot 3 Backend API & Embedded JobRunr Worker
  ats-java-backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: ats-java-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats_db}
      - DATABASE_USER=${POSTGRES_USER:-ats_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-ats_password}
      - JWT_SECRET=${JWT_SECRET:-your-very-long-secret-key-at-least-256-bits-for-hs256-algorithm}
      - JWT_EXPIRATION_MS=86400000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - UPLOAD_DIR=/app/uploads
      - PORT=8080
    ports:
      - "8080:8080" # REST API & Swagger UI (/swagger-ui.html)
      - "8000:8000" # JobRunr Dashboard
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - ats-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # React Frontend (HTML, CSS, JS, React) served via Nginx
  ats-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-frontend
    ports:
      - "3000:80"
    networks:
      - ats-network
    depends_on:
      ats-java-backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  ats-network:
    driver: bridge
