version: '3.8'

services:
  # PostgreSQL Database with Row-Level Security (RLS)
  postgres:
    image: postgres:15-alpine
    container_name: ats-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats_db}
      POSTGRES_USER: ${POSTGRES_USER:-ats_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats_dev_password_2024}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ats_user} -d ${POSTGRES_DB:-ats_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for pub/sub and high-speed caching
  redis:
    image: redis:7-alpine
    container_name: ats-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ats-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Java 21 / Spring Boot 3 Backend API & Embedded JobRunr Worker
  ats-java-backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: ats-java-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats_db}
      - DATABASE_USER=${POSTGRES_USER:-ats_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — set a strong random value}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174
      - UPLOAD_DIR=/app/uploads
      - PORT=8080
      # First-run admin bootstrap — unset after the account is created
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # JobRunr dashboard — disabled by default, never expose port 8000 publicly
      - JOBRUNR_DASHBOARD_ENABLED=false
    ports:
      - "8080:8080" # REST API
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - ats-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # React Frontend (HTML, CSS, JS, React) served via Nginx
  ats-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-frontend
    ports:
      - "3000:80"
    networks:
      - ats-network
    depends_on:
      ats-java-backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  ats-network:
    driver: bridge
