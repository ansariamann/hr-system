server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-Frame-Options           "DENY"                         always;
    add_header X-XSS-Protection          "1; mode=block"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8080 ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
        always;

    # ─── Gzip Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # ─── Static assets cache (fingerprinted, safe to cache 1yr) ─────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers (add_header doesn't inherit in nested blocks)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
    }

    # ─── SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API Proxy → Java backend ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://ats-java-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # Hide internal server info
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Limit request body (resume uploads have their own limit via Spring)
        client_max_body_size 26M;
    }

    # ─── SSE live streaming (buffering off) ──────────────────────────────
    location /api/v1/stream/ {
        proxy_pass             http://ats-java-backend:8080/api/v1/stream/;
        proxy_http_version     1.1;
        proxy_set_header       Connection '';
        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding off;
        proxy_read_timeout     24h;
    }

    # ─── Block hidden files (.git, .env, etc.) ───────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
